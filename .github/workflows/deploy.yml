name: Build and Deploy Repository

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'srcpkgs/noctalia/**'
      - 'srcpkgs/umbriel/**'
      - 'srcpkgs/noctalia-greeter/**'
      - 'common/scripts/generate-site.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build XBPS Packages & Generate Web Interface
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Void Container
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash grep curl git tar xtools python3
          useradd -m -G xbuilder builder || true
          chown -R builder:xbuilder .

      - name: Bootstrap Masterdir
        run: |
          su builder -c "./xbps-src -m masterdir-x86_64 binary-bootstrap"

      - name: Build Noctalia
        run: |
          su builder -c "./xbps-src -m masterdir-x86_64 pkg noctalia"

      - name: Build Umbriel
        run: |
          su builder -c "./xbps-src -m masterdir-x86_64 pkg umbriel"

      - name: Build Noctalia Greeter
        run: |
          su builder -c "./xbps-src -m masterdir-x86_64 pkg noctalia-greeter"

      - name: Create Repo Index & Generate Website
        run: |
          mkdir -p deploy/x86_64
          cp -v hostdir/binpkgs/*.xbps deploy/x86_64/ 2>/dev/null || cp -v hostdir/binpkgs/*/*.xbps deploy/x86_64/ 2>/dev/null || true
          xbps-rindex -a deploy/x86_64/*.xbps
          bash common/scripts/generate-site.sh deploy

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
