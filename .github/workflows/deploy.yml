name: Build and Deploy Repository

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build XBPS Packages & Generate Web Interface
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache XBPS Binary Packages
        uses: actions/cache@v4
        with:
          path: hostdir/binpkgs
          key: xbps-binpkgs-${{ runner.os }}-${{ hashFiles('srcpkgs/noctalia/**', 'srcpkgs/umbriel/**', 'srcpkgs/noctalia-greeter/**') }}
          restore-keys: |
            xbps-binpkgs-${{ runner.os }}-

      - name: Prepare Void Container
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash grep curl git tar xtools python3
          useradd -m -G xbuilder builder || true
          chown -R builder:xbuilder .

      - name: Bootstrap Masterdir
        run: |
          su builder -c "./xbps-src -m masterdir-x86_64 binary-bootstrap"

      - name: Build Noctalia
        run: |
          pkg="noctalia"
          if ls hostdir/binpkgs/${pkg}-[0-9]*.xbps 1>/dev/null 2>&1 || ls hostdir/binpkgs/*/${pkg}-[0-9]*.xbps 1>/dev/null 2>&1; then
            if git diff --quiet HEAD~1 HEAD -- srcpkgs/${pkg}/ 2>/dev/null; then
              echo "No changes in srcpkgs/${pkg} and package binary exists in hostdir/binpkgs. Skipping build."
            else
              su builder -c "./xbps-src -m masterdir-x86_64 pkg ${pkg}"
            fi
          else
            su builder -c "./xbps-src -m masterdir-x86_64 pkg ${pkg}"
          fi

      - name: Build Umbriel
        run: |
          pkg="umbriel"
          if ls hostdir/binpkgs/${pkg}-[0-9]*.xbps 1>/dev/null 2>&1 || ls hostdir/binpkgs/*/${pkg}-[0-9]*.xbps 1>/dev/null 2>&1; then
            if git diff --quiet HEAD~1 HEAD -- srcpkgs/${pkg}/ 2>/dev/null; then
              echo "No changes in srcpkgs/${pkg} and package binary exists in hostdir/binpkgs. Skipping build."
            else
              su builder -c "./xbps-src -m masterdir-x86_64 pkg ${pkg}"
            fi
          else
            su builder -c "./xbps-src -m masterdir-x86_64 pkg ${pkg}"
          fi

      - name: Build Noctalia Greeter
        run: |
          pkg="noctalia-greeter"
          if ls hostdir/binpkgs/${pkg}-[0-9]*.xbps 1>/dev/null 2>&1 || ls hostdir/binpkgs/*/${pkg}-[0-9]*.xbps 1>/dev/null 2>&1; then
            if git diff --quiet HEAD~1 HEAD -- srcpkgs/${pkg}/ 2>/dev/null; then
              echo "No changes in srcpkgs/${pkg} and package binary exists in hostdir/binpkgs. Skipping build."
            else
              su builder -c "./xbps-src -m masterdir-x86_64 pkg ${pkg}"
            fi
          else
            su builder -c "./xbps-src -m masterdir-x86_64 pkg ${pkg}"
          fi

      - name: Create Repo Index & Generate Website
        run: |
          mkdir -p web/x86_64 docs/x86_64
          cp -v hostdir/binpkgs/*.xbps web/x86_64/ 2>/dev/null || cp -v hostdir/binpkgs/*/*.xbps web/x86_64/ 2>/dev/null || true
          cp -v web/x86_64/*.xbps docs/x86_64/ 2>/dev/null || true
          xbps-rindex -a web/x86_64/*.xbps
          xbps-rindex -a docs/x86_64/*.xbps
          bash common/scripts/generate-site.sh web
          bash common/scripts/generate-site.sh docs

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Pages Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: deploy-site

      - name: Extract Artifact
        run: |
          mkdir -p extracted-site
          tar -xf deploy-site/artifact.tar -C extracted-site || cp -r deploy-site/* extracted-site/

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./extracted-site
          publish_branch: gh-pages

      - name: Deploy to GitHub Pages API
        id: deployment
        uses: actions/deploy-pages@v4
